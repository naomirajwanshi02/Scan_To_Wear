<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ecdfc6">
<title>Scan to Wear</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%BA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hub.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
</head>
<body>
<div id="ar"></div>

<section id="perm" class="screen">
  <div class="plate">
    <h1>Scan to Wear</h1>
    <p>Scan a picture to experience the wearable interaction associated with it. Tap the button, then choose <b>Allow</b>.</p>
    <button class="btn" id="permBtn">Allow camera</button>
    <div class="status" id="permStatus"></div>
  </div>
</section>

<div id="guide" class="overlay">
  <button class="iconbtn guideclose" id="guideClose" aria-label="Back to Scan to Wear"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
  <div class="scan-top plate"><b>Scan a picture to wear</b><span class="cap">Its wearable opens</span></div>
  <div class="frame"><i></i><i></i><i></i><i></i><div class="sweep"></div></div>
  <div class="scan-bottom">
    <div class="status" id="scanStatus">Starting camera…</div>
  </div>
</div>


<div id="found" class="found"><div class="plate"><b id="foundName"></b><span id="foundSub"></span></div></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
